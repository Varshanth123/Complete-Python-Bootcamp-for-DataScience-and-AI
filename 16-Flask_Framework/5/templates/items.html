<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask ToDo CRUD App</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            margin:30px;
        }

        h1{
            text-align:center;
        }

        .container{
            width:700px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
        }

        button{
            padding:10px 15px;
            margin:5px;
            cursor:pointer;
        }

        .output{
            margin-top:20px;
            background:#eee;
            padding:15px;
            white-space:pre-wrap;
        }

        hr{
            margin:25px 0;
        }
    </style>
</head>
<body>

<div class="container">

<h1>Flask CRUD API</h1>

<button onclick="getItems()">Get All Items</button>

<hr>

<h3>Get Item By ID</h3>

<input type="number" id="getId" placeholder="Enter Item ID">

<button onclick="getItem()">Get Item</button>

<hr>

<h3>Add New Item</h3>

<input type="text" id="name" placeholder="Item Name">

<input type="text" id="description" placeholder="Description">

<button onclick="addItem()">Add Item</button>

<hr>

<h3>Update Item</h3>

<input type="number" id="updateId" placeholder="Item ID">

<input type="text" id="updateName" placeholder="New Name">

<input type="text" id="updateDescription" placeholder="New Description">

<button onclick="updateItem()">Update Item</button>

<hr>

<h3>Delete Item</h3>

<input type="number" id="deleteId" placeholder="Item ID">

<button onclick="deleteItem()">Delete Item</button>

<hr>

<h3>Response</h3>

<div class="output" id="output">
Result will appear here...
</div>

</div>

<script>

const output = document.getElementById("output");

function show(data){
    output.innerHTML = "<pre>" + JSON.stringify(data,null,4) + "</pre>";
}

// GET ALL
async function getItems(){

    const response = await fetch("/items");
    const data = await response.json();

    show(data);
}

// GET ONE
async function getItem(){

    const id = document.getElementById("getId").value;

    const response = await fetch(`/items/${id}`);

    const data = await response.json();

    show(data);
}

// POST
async function addItem(){

    const name = document.getElementById("name").value;
    const description = document.getElementById("description").value;

    const response = await fetch("/items",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            name:name,
            description:description
        })

    });

    const data = await response.json();

    show(data);

}

// PUT
async function updateItem(){

    const id = document.getElementById("updateId").value;

    const name = document.getElementById("updateName").value;

    const description = document.getElementById("updateDescription").value;

    const response = await fetch(`/items/${id}`,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:name,
            description:description

        })

    });

    const data = await response.json();

    show(data);

}

// DELETE
async function deleteItem(){

    const id = document.getElementById("deleteId").value;

    const response = await fetch(`/items/${id}`,{

        method:"DELETE"

    });

    const data = await response.json();

    show(data);

}

</script>
</body>
</html>
